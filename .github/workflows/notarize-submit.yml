name: Submit macOS Release for Notarization

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to submit
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: notarize-submit-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit macOS release assets to Apple
    runs-on: macos-latest
    environment: release

    steps:
      - name: Prepare Apple notarization credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Injection-safe: read the dispatch input from env, never expand ${{ }}
          # straight into the shell (a newline-bearing input could otherwise inject
          # arbitrary vars into GITHUB_ENV for later steps holding notary creds).
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          umask 077

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          export API_KEY_PATH

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          api_key = os.environ["APPLE_API_KEY_P8"]
          if "\\n" in api_key and "\n" not in api_key:
              api_key = api_key.replace("\\n", "\n")
          if "BEGIN PRIVATE KEY" not in api_key:
              api_key = base64.b64decode("".join(api_key.split())).decode("utf-8")
          if not api_key.endswith("\n"):
              api_key += "\n"
          Path(os.environ["API_KEY_PATH"]).write_text(api_key, encoding="utf-8")
          PY

          xcrun notarytool history \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null

          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9][0-9A-Za-z.+-]*$'; then
            echo "::error::Invalid tag input: $INPUT_TAG" >&2
            exit 1
          fi

          {
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "NOTARIZE_TAG=$INPUT_TAG"
          } >> "$GITHUB_ENV"

      - name: Download macOS release ZIP assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p notarization-input
          gh release download "${NOTARIZE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "*-mac.zip" \
            --dir notarization-input

      - name: Submit x64 and arm64 ZIPs
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p notarization-output

          submit_zip() {
            local label="$1"
            local zip_path="$2"
            local output_path="notarization-output/${label}.submit.json"

            if [ ! -f "$zip_path" ]; then
              echo "::error::Missing ${label} ZIP asset for notarization." >&2
              exit 1
            fi

            xcrun notarytool submit "$zip_path" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --no-wait \
              --output-format json > "$output_path"
          }

          x64_zips=()
          while IFS= read -r zip_path; do
            x64_zips+=("$zip_path")
          done < <(find notarization-input -type f -name 'Paperclip-Desktop-*-mac.zip' ! -name '*arm64*' | sort)

          arm64_zips=()
          while IFS= read -r zip_path; do
            arm64_zips+=("$zip_path")
          done < <(find notarization-input -type f -name 'Paperclip-Desktop-*-arm64-mac.zip' | sort)
          if [ "${#x64_zips[@]}" -ne 1 ] || [ "${#arm64_zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one x64 and one arm64 mac ZIP for notarization." >&2
            printf 'x64 matches: %s\n' "${x64_zips[@]:-<none>}" >&2
            printf 'arm64 matches: %s\n' "${arm64_zips[@]:-<none>}" >&2
            exit 1
          fi

          submit_zip "x64" "${x64_zips[0]}"
          submit_zip "arm64" "${arm64_zips[0]}"

          python - <<'PY'
          import json
          from pathlib import Path

          lines = ["# Notarization submissions", ""]
          for label in ("x64", "arm64"):
              path = Path("notarization-output") / f"{label}.submit.json"
              payload = json.loads(path.read_text())
              submission_id = payload.get("id") or payload.get("submissionId") or "unknown"
              message = payload.get("message") or ""
              lines.append(f"- {label}: `{submission_id}` {message}".rstrip())
          Path("notarization-output/summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cat notarization-output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-submissions-${{ github.event.inputs.tag }}
          path: notarization-output
          if-no-files-found: error

      - name: Clean up Apple notarization credentials
        if: always()
        run: rm -f "${APPLE_API_KEY:-}"
